2.4 Особые физические черты
Телосложение и пластика
Крепкий, сухой и необычайно подвижный мужчина. Плотная мускулатура развита без избыточного объёма - сильные ноги, спина и плечевой пояс сочетаются с гибкостью акробата. Его подготовка рассчитана на рывки, лазание, борьбу, длительные переходы и многочасовую работу в кабине. Он легко меняет уровень корпуса, хорошо чувствует равновесие и умеет падать. Кажущаяся расхлябанность исчезает в тот момент, когда требуется точное движение. Разминается даже за беседой. Перекатывает плечи, вращает кистями, переносит вес с пятки на носок.

Сильная и точная хватка
Кисти и предплечья сочетают большую силу с тонким контролем движений. Развитые сгибатели пальцев и прочные сухожилия позволяют удерживать вес тела на крошечных уступах, цепляться за узкие края и уверенно менять хват во время подъёма. Нейтан с детства увлекался скалолазанием и хорошо чувствует опору. Умеет распределять нагрузку между пальцами, точно ставить ноги и переносить корпус так, чтобы использовать даже неудобный рельеф. Эта же выучка помогает ему свободно перемещаться по корпусам машин и конструкциям. Пальцы остаются ловкими и чувствительными, что особенно полезно при работе с мелкими деталями и электроникой.

Следы Великой войны
Большой шрам пересекает область правого глаза, заходя на бровь, веко и скулу. Левый глаз сохранил голубую радужку. Правый после ранения в &quot;Великой войне&quot; с внегалактическими существами приобрёл розовый оттенок. Оба глаза видят чётко. Изменение цвета связано с аномальным воздействием противника и последующим восстановлением тканей. Грудь, спина, руки и ноги покрыты старыми шрамами от осколков, ожогов и разрывов кожи. Внешне он цел, но эта целостность досталась ему дорого.

Белая пигментация
Волосы на голове и по всему телу, включая брови, ресницы и щетину, утратили пигмент после применения древнего артефакта. Это приобретённое последствие контакта, а не возрастная седина. Кожа сохранила исходный тёплый оттенок. Отросшие волосы остаются белыми, обычное восстановление организма не возвращает им прежний цвет.

Костный комплекс
У Нейтана усилена регуляция формирования костной ткани. Плотный кортикальный слой сочетается с развитой внутренней трабекулярной структурой. В пределах мира эта мутация позволяет выдерживать удары и силовые нагрузки, при которых обычный человек получил бы перелом. Опорно-двигательный аппарат остаётся подвижным. Рост кости ограничен, суставные щели и нервные каналы сохранены.

Мышечный комплекс
Ослаблен миостатиновый тормоз роста скелетной мускулатуры. Мышечные волокна легче увеличивают поперечное сечение в ответ на нагрузку, а регулярные тренировки позволяют удерживать большую силу при компактном телосложении. У Дрейка это дополнено аномально эффективным вовлечением двигательных единиц. Он способен коротким усилием сдвинуть тяжёлый механизм, удержать сорвавшегося человека или вырваться из захвата, рассчитанного на обычного бойца. 

Нейромоторный комплекс
Аномальные изменения нервной системы сократили задержку между восприятием сигнала и мышечным ответом. Ускоренное проведение нервных импульсов сочетается с быстрой обработкой зрительной, слуховой и вестибулярной информации. Нейтан раньше обычного человека замечает начало движения и успевает отреагировать на внезапную перемену обстановки. Точно отслеживает движущиеся объекты, быстро переключает внимание и мгновенно вносит поправки в положение тела. Развитое чувство положения конечностей позволяет сохранять согласованность движений во время падения, прыжка или резкого разворота. В кабине эти особенности проявляются в быстрой и точной работе с органами управления.

Быстрые мышечные волокна обладают повышенной скоростью сокращения и расслабления, а согласованная работа двигательных единиц обеспечивает мощное отталкивание без лишнего напряжения. Нейтан стремительно срывается с места, за несколько шагов набирает высокую скорость и поддерживает частый, упругий бег. Сильные мышцы ног и корпуса вместе с эластичными сухожилиями позволяют эффективно возвращать энергию каждого шага, резко тормозить и быстро ускоряться в новом направлении. Координация сохраняется и на высокой скорости, поэтому он уверенно огибает препятствия и переходит от бега к прыжку или подъёму. В сочетании с метаболическим комплексом это даёт ему возможность повторять взрывные ускорения и долго сохранять высокий темп движения.

Метаболический комплекс
Организм необычно устойчив к длительной нагрузке и умеренному недостатку кислорода. Адаптивная регуляция ответа на гипоксию сочетается с густой капиллярной сетью, высокой окислительной мощностью мышц и экономным расходованием топлива при ровном темпе. Нейтан дольше сохраняет ясность мышления в душной кабине и продолжает действовать после изнуряющего марша. 

Соединительнотканный комплекс

Нейтан производит впечатление человека, который даже на собственный разбор полётов пришёл бы с чашкой чая и вопросом, почему все такие мрачные. Весёлый, ехидный, раскрепощённый, он охотно шутит над обстоятельствами и над собой. Легко вступает в разговор, любит живые впечатления и быстро увлекается интересной затеей. Может намеренно выглядеть чуть легкомысленнее, чем есть. Почти всегда держится с самодовольной улыбкой, и мало кто видел его по-настоящему подавленным.

Беззаботность и идеализм
Нейтан любит жить так, будто впереди ещё достаточно времени для всего интересного. Легко подхватывает чужую затею, может запеть посреди работы, устроить небольшой праздник после тяжёлого дня или увлечённо спорить о пустяке, пока вокруг царит всеобщая тревога. Ему нравится сам процесс жизни. Вкусная еда, музыка, скорость, удачный манёвр и хорошая компания радуют его искренне. Даже когда мир горит, он будет веселиться, пока ещё бьётся сердце.

В этой беззаботности есть привычка убегать от тяжёлой реальности. Дрейк умеет чинить повреждённую машину, находить выход из окружения и принимать сложные решения. Гораздо труднее ему надолго остаться наедине с потерями, усталостью и мыслями о том, что уже невозможно исправить. Тогда он ищет новую дорогу, берётся за интересную работу или собирает вокруг себя людей. Разговор о собственных переживаниях часто переводит в шутку, а неприятные размышления откладывает до тех пор, пока снова не появится дело.

При этом остаётся упрямым идеалистом. Верит, что люди способны становиться лучше, чужая доброта заслуживает ответа, а у жизни должно быть больше смысла, чем бесконечное выживание. Легко загорается мечтой и умеет говорить о будущем так, что оно кажется достижимым даже среди развалин. Ему хочется, чтобы у его товарищей оставались свои желания, смешные привычки и поводы радоваться. Он охотно втягивает их в разговоры, музыку и маленькие праздники, возвращая ощущение, что жизнь продолжается.

Самодовольная уверенность
Нейтан привык доверять собственному уму, реакции и умению выкручиваться. Держится так, будто уже знает, где искать выход, даже когда решение только складывается у него в голове. Любит произвести впечатление, красиво закончить манёвр и заметить чужое восхищение. Не стесняется похвастаться удачей или напомнить, кто только что спас положение. Неудачу встречает раздражённой усмешкой и быстро переключается на следующую попытку. Чужая уверенность в невозможности задачи часто лишь раззадоривает его.

Любопытство и отношение к людям

Любопытство - его двигатель и самая надёжная приманка. Закрытая дверь интересует его сильнее открытого хранилища. Непонятная надпись способна задержать дольше нужного. Он любит красивое решение, заслуженное восхищение и хороший гонорар. Может заявить, что всё сделал исключительно за деньги, уже после того как потратил половину награды на чужое спасение. При этом не святой. Торгуется, хвастается удачным манёвром, любит эффектно появиться и убеждён, что в мире нет ничего необъяснимого.

В основе его поведения лежит простая доброта. Он умеет накормить, выслушать, починить чужую вещь и не превращать помощь в пожизненный долг. Не любит унижение слабых, бессмысленную жестокость и начальников, считающих людей расходным материалом. Может быть жёстким в бою и без колебаний пресечь угрозу, но не наслаждается чужим бессилием. Насмешкой чаще снимает напряжение, чем причиняет боль. Если задел близкого человека, постарается исправить это делом, а затем всё-таки извинится словами.

Особенно любит открытых и добрых людей, с которыми легко говорить прямо, смеяться и делиться тем, что действительно интересно. Замкнутые и холодные собеседники будят в нём другой интерес. Нейтану нравится &quot;раскалывать&quot; их сдержанность, подмечать неожиданные увлечения, вытягивать на живой разговор и ловить искренние реакции. Может поддеть шуткой, задать непривычный вопрос или затеять спор, чтобы увидеть человека за привычной невозмутимостью. Момент, когда суровый молчун вдруг начинает увлечённо рассказывать или смеяться, доставляет ему особенное удовольствие.

Поведение в опасности
В опасности его мышление становится особенно собранным, а внешняя манера сохраняет привычную дерзость. Нейтан способен шутить по связи, улыбаться противнику и получать удовольствие от сложного манёвра, одновременно следя за обстановкой. Азарт помогает ему удерживать инициативу. Решителен, храбр и настойчив, продолжает искать решение, когда очевидные варианты уже закончились.

Как командир объясняет замысел, делегирует специалистам и берёт ответственность за собственный приказ. Особенно плохо переносит ситуацию, где кого-то нужно оставить. Может потратить последний резерв на ещё одну попытку эвакуации. Его беззаботная манера соседствует с сильной привязанностью к своим людям. Желание свободно идти за любой тайной постоянно сталкивается с пониманием, что за ним теперь идут другие.

Мудрость и мечты

Мудрость Дрейка выросла из ошибок, долгих дорог и разговоров с очень разными существами. Он любит философствовать за чаем. О свободе, цене победы, праве уйти и обязанности вернуться. Иногда вставляет древнее выражение, оставляет паузу и с заметным удовольствием ждёт просьбы перевести. Не считает прожитые годы доказательством собственной правоты. Любит молодых совершеннолетних женщин, взаимный флирт и острый ум.

Мечтает не о следующей войне, а о собственном тихом месте. Мастерская, надёжный ангар, длинный стол и чай, которого хватит каждому гостю. Пока же постоянно находит причину отложить эту жизнь. Ему проще снова починить чужую машину, чем признать, что сам он тоже устал.

Привычки

Чай сопровождает почти весь его день - горячий, остывший, крепкий или лёгкий - под настроение и задачу. Он разбирается в листьях, воде и заваривании. Любимый ритуал - спокойно прогреть чашку перед тяжёлой работой. Не курит. Алкоголь допускает понемногу, когда смена и полёт закончены. Любит солёную и острую пищу. Белый шум, гул вентиляторов и ровное шуршание фена помогают уснуть.

3.2 Яркие черты и умственные навыки
Боевой и инженерный склад ума
Нейтан быстро обрабатывает информацию в напряжённой обстановке. Видит связь между действиями противника, возможностями техники и особенностями местности. Обладает развитым пространственным мышлением, умеет оценивать траектории и просчитывать результат манёвра на ходу. Выделяет главное среди множества сигналов и быстро меняет решение при появлении новых обстоятельств.

При ремонте способен мысленно разобрать механизм на части, представить работу его узлов и найти причину неисправности. Хорошо понимает, как изменение одной детали повлияет на всю систему, и подбирает рабочее решение даже при недостатке запчастей. Его мышление сочетает практичность инженера, реакцию пилота и привычку искать нестандартный выход.

Быстрая обучаемость
Быстро учится через наблюдение и практику. Схватывает принцип работы незнакомого устройства, запоминает показанную последовательность действий и переносит освоенные приёмы на похожие задачи. Охотно задаёт точные вопросы и проверяет догадки на деле. Допущенную ошибку разбирает по причинам, поэтому следующая попытка обычно заметно точнее предыдущей. Особенно легко ему даются пилотирование, механика, электроника и двигательные навыки.

Чувство машины
Мысленно собирает мех в единую кинематическую схему. Чувствует массу, инерцию, предел сцепления, задержку приводов и доступный запас мощности. По звуку и вибрации отличает неисправность от обычного износа. Быстро осваивает незнакомую платформу, но сначала проверяет органы управления и ограничения. 

Малые космические суда
Умеет пилотировать небольшие космические суда, включая шаттлы, лёгкие транспортники и экспедиционные корабли. Разбирается в их управлении и навигации, выполняет стыковку, орбитальные манёвры и посадку на поверхность. Знаком с базовым обслуживанием бортовых систем. Может найти неисправный контакт, восстановить повреждённую проводку, заменить доступный модуль и привести в порядок механические узлы. Этих навыков хватает для текущего ремонта и возвращения в строй потрёпанной машины, если основные системы ещё работоспособны.

Гравитационные платформы и антигравитационная техника
Уверенно пилотирует гравитационные платформы, ховеры и другую антигравитационную технику. Хорошо чувствует скорость, инерцию и отклик машины на управление. Точно выдерживает высоту, рассчитывает тормозной путь и проводит аппарат через тесные проходы, используя доступное пространство до последнего метра. При смене нагрузки быстро подстраивает манеру пилотирования под изменившееся поведение машины. Особенно любит скоростные манёвры над сложным рельефом, где нужно одновременно читать местность, удерживать траекторию и заранее видеть следующий поворот.

Управление наземной техникой
Водит багги, бронетранспортёры, вездеходы и тяжёлые грузовые машины. Умеет управлять ходовой частью и рабочими механизмами буровых платформ. Чувствует габариты, распределение массы и сцепление с поверхностью, подбирает темп движения под грунт, уклон и состояние техники. На лёгкой машине охотно использует её манёвренность, а за рулём тяжёлой заранее рассчитывает поворот и остановку. По поведению двигателя, подвески и трансмиссии замечает неполадки ещё до того, как они заставят экипаж продолжить путь пешком.

Полевая робототехника
Умеет собирать полезные устройства из доступных деталей и узлов списанной техники. Может соорудить разведывательный дрон, ремонтного паука, простую турель или дистанционный манипулятор. Подбирает совместимые компоненты, налаживает питание и управление, настраивает датчики и приводы под конкретную задачу. Хорошо приспосабливает готовые механизмы к новой работе. В его мастерской сломанный робот быстро превращается в запас деталей для нескольких других. Особую радость ему доставляет момент, когда собранная из разномастного железа конструкция впервые самостоятельно выполняет команду.

Паркур и акробатика
С детства увлекался скалолазанием, а годы экспедиций и боёв превратили эту привычку в уверенное владение собственным телом. Быстро перемещается по разрушенным конструкциям, корпусам кораблей, недостроенным платформам, скалам и городским руинам. На ходу замечает опоры, связывает прыжки, подтягивания и перелезания в непрерывное движение. Умеет сохранять равновесие на узких поверхностях, точно приземляться и быстро менять направление. Сильная, ловкая хватка позволяет удерживаться на крошечных уступах и перехватываться за неудобные выступы. В незнакомом месте почти сразу замечает путь наверх.

Тактическая импровизация
Умеет менять план внутри уже начатого манёвра. Видит полезные особенности местности и техники, заставляет противника играть по своим правилам. В больших операциях удерживает общую задачу, распределяет роли и не мешает специалисту, который знает свой участок лучше. Особенно силён там, где стандартный протокол перестал работать.

Грязный бой - &quot;Хшардрал&quot;
Основа - опыт бокса, карате, борьбы и других школ. Собственный стиль построен на обмане ожиданий, смене темпа, нарушении равновесия и использовании окружения. Дрейк не вступает в обмен ударами ради красивого поединка. Его подвижность, сильный захват и короткие взрывные усилия позволяют навязать неудобную дистанцию. В основном данный стиль боя подходит именно за рулём меха, но и в простом ближнем бою показывает интересные результаты.

Оружейная грамотность
За долгие кампании освоил множество стрелковых систем и хорошо работает со штурмовым оружием. Понимает отдачу, режимы огня, обслуживание и ограничения боеприпаса. Уверенно действует в ЛБС и СБС. 

Языки и артефакты
Владеет несколькими современными языками и читает ряд древних письменностей. Различает назначение надписи, учитывает контекст и охотно сверяет перевод с записями. Знает типичные принципы древних механизмов, способы их консервации и признаки опасной активации. Всё неизвестное считает поводом для исследования, хотя азарт порой заставляет его слишком рано перейти от наблюдения к проверке.

Певческий голос
Обладает низким, насыщенным голосом с тёплым грудным тембром и хорошим музыкальным слухом. Красиво поёт, уверенно берёт низкие ноты, точно держит мелодию и умеет вести протяжённые фразы на ровном дыхании. Особенно выразительно звучит в спокойных песнях и балладах, где можно раскрыть глубину голоса. Легко подхватывает знакомую мелодию и охотно поёт в компании. Во время работы иногда негромко напевает себе под нос.

Хороший повар &quot;Из того, что есть&quot;
Умеет приготовить вкусную, сытную еду из скудных экспедиционных запасов и случайных находок на местном рынке. Хорошо обращается с мясом, чувствует сочетания вкусов и умеет придать характер даже надоевшему походному пайку. Ловко заменяет недостающие ингредиенты, готовит на маленькой корабельной кухне или у походного огня и редко нуждается в точном рецепте. Сам предпочитает солёное и острое, но запоминает вкусы товарищей и подстраивает приправы под компанию. Кормить людей ему нравится почти так же, как угощать их чаем.

Про его стряпню в команде шутят. &quot;Дайте ему мясо и гранит, и будет вам солёное мяско&quot;.

Вкус к жизни
Меломан без привязанности к одному жанру. Слушает то, что приятно слуху, сердцу и разуму. В мастерской может сменить тяжёлую музыку на старинную балладу, а затем потребовать тишины, чтобы услышать подшипник. Чай - лучший напиток во вселенной. Запоминает, кто что любит, спорит о заварке серьёзнее, чем о званиях. Обожает белый шум в виде вентиляторов или звука фена.

3.3 Осколки воспоминаний
Белое утро
Во время одной из экспедиций Нейтан вместе с командой нашёл древний артефакт. При активации его воздействие охватило всех, кто стоял рядом. Волосы обесцветились целиком, включая брови, ресницы и щетину. Участники ещё некоторое время разглядывали друг друга, пытаясь привыкнуть к одинаково белым головам.

Вскоре обнаружились и другие перемены. Организм легче переносил нагрузки, быстрее восстанавливался, прибавились сила и выносливость. У Нейтана изменения особенно заметно проявились в работе мышц и общей физической устойчивости. Воздействие артефакта оказалось благотворным, а белый цвет волос так и остался у всех, кто попал под него.

Древний драндулет
Предмет, ради которого Нейтан добрался до далёкой планеты, оказался искусной подделкой. Поиски отняли немало времени, а обратный путь пришлось искать среди остатков старой стоянки. Там он и обнаружил небольшой древний корабль, покрытый пылью и следами долгого запустения.

Нейтан вскрыл сервисные панели, проверил питание и постепенно вернул к жизни погасший пульт. Зачистил окислившиеся соединения, заменил неисправный блок одним из уцелевших запасных и освободил заклинивший механизм. После нескольких попыток судно отозвалось тяжёлым гулом. Дрейк ещё долго проверял показания и разбирался с расположением органов управления, прежде чем решился на взлёт.

Старый драндулет поднялся над стоянкой, дрожа всем корпусом, и всё же вышел на орбиту. Нейтан увёл его от планеты и проложил обратный курс. Бесполезная подделка лежала рядом с креслом, пока он следил за приборами и прислушивался к неровному гулу двигателя.

Война за ГАЛАКТИКУ!
Великая война принесла существ из-за пределов галактики. Их прозвали &quot;Хшарами&quot;. Одно такое создание могло выдержать натиск целой флотилии... Нейтан за кампанию уничтожил несколько, действуя в одиночку на мехе. Это не было превосходством лобовой огневой мощи. Он находил уязвимые фазы, использовал близкую дистанцию, особенности среды и возможность действовать внутри зон, куда корабли не могли безопасно вести огонь. Машины после этих боёв восстанавливались не всегда. Хотя больше в степени ему помогали множество артефактов и очень много удачи, существа которые могут дезинтегрировать пространство и только чего ещё не умеют... очень тяжёлые противники.

Ловушка для Хшара

Он помнит, как под ногами Титана рассыпался камень, а позади исчезали целые участки склона. Хшар шёл следом, стирая пространство вместе с тем, что в нём находилось. Нейтан вёл его к ловушке, оставляя противнику ровно столько надежды настичь ускользающую машину, чтобы тот не прекратил погоню. На последнем участке уже не оглядывался. Только считал расстояние и улыбался, крепко стиснув зубы.

Антиматериальная бомба сработала, когда существо оказалось внутри подготовленной зоны. Горизонт превратился в ослепительную белую полосу, а показания внешних датчиков исчезли одно за другим. Взрыв уничтожил часть планеты вместе с загнанным в ловушку Хшаром. Нейтана вынесло за пределы разрушения на искалеченной машине. Позже он долго смотрел на карту, где вместо знакомого участка поверхности зияла пустота.

Кабина и ноги

От меха остались кабина и ноги. Оружие, манипуляторы и большая часть корпуса были потеряны во время встречи с группой Хшаров. Последние минуты боя трудно было назвать боем. Дрейк убегал, выжимая из уцелевших приводов всё, что они ещё могли отдать. Машина неслась прочь с такой прытью, будто тоже прекрасно понимала, чем закончится остановка.

Теперь он сидел возле раскрытого сервисного люка, держа чашку между коленями. На полу лежали обгоревшие детали, рядом сохли вымытые разъёмы. Нейтан перебирал повреждённую электронику, соединял уцелевшие системы и время от времени отступал, чтобы оценить получившееся безобразие. &quot;Ноги есть. Голова на месте. Уже богаче некоторых&quot;. Первый ровный шаг восстановленного меха он встретил той же самодовольной улыбкой, с которой потом рассказывал, что всего лишь решил сменить позицию.

Последний бой

Основные силы Хшаров сомкнули кольцо. Путь отхода ещё оставался, но времени провести через него всех уже не было. Нейтан приказал союзникам отступать. Без долгой речи, без просьб запомнить его. Убедился, что приказ принят, развернул мех навстречу противнику и направил оставшуюся мощность в движение. На лице всё ещё держалась привычная самодовольная улыбка.

Он вступил в схватку на предельной дистанции, прорываясь сквозь огонь и разрушающееся пространство к одному из высших Хшаров. Машина теряла системы, но продолжала отвечать. Нейтану удалось навязать ближний бой и нанести существу смертельное ранение. На мгновение продвижение противника захлебнулось. Этого хватило, чтобы отступающие союзники выиграли необходимое время.

Ответный удар уничтожил мех вместе с пилотом. Нейтан Дрейк погиб в этом бою. Последний пакет с его нейрослепком успел покинуть машину до разрушения кабины. Принимающая система подтвердила целостность данных. Нейрослепок был успешно сохранён.

<script type="application/json" id="profile-data">{"version":6,"fields":[{"no":"1.1","label":"Имя","value":"Нейтан","kind":"short"},{"no":"1.2","label":"Фамилия","value":"Дрейк","kind":"short"},{"no":"1.3","label":"Личный идентификатор","value":"JASMINE-DRAGON|1-3|8-7|496-897|73-42|2022","kind":"id"},{"no":"2.1","label":"Вес","value":"88 кг","kind":"short"},{"no":"2.2","label":"Рост","value":"182 см","kind":"short"},{"no":"2.3","label":"Пол","value":"Мужской (М)","kind":"short"},{"no":"2.4","label":"Особые физические черты","value":"### Телосложение и пластика\nКрепкий, сухой и необычайно подвижный мужчина. Плотная мускулатура развита без избыточного объёма - сильные ноги, спина и плечевой пояс сочетаются с гибкостью акробата. Его подготовка рассчитана на рывки, лазание, борьбу, длительные переходы и многочасовую работу в кабине. Он легко меняет уровень корпуса, хорошо чувствует равновесие и умеет падать. Кажущаяся расхлябанность исчезает в тот момент, когда требуется точное движение. Разминается даже за беседой. Перекатывает плечи, вращает кистями, переносит вес с пятки на носок.\n\n### Сильная и точная хватка\nКисти и предплечья сочетают большую силу с тонким контролем движений. Развитые сгибатели пальцев и прочные сухожилия позволяют удерживать вес тела на крошечных уступах, цепляться за узкие края и уверенно менять хват во время подъёма. Нейтан с детства увлекался скалолазанием и хорошо чувствует опору. Умеет распределять нагрузку между пальцами, точно ставить ноги и переносить корпус так, чтобы использовать даже неудобный рельеф. Эта же выучка помогает ему свободно перемещаться по корпусам машин и конструкциям. Пальцы остаются ловкими и чувствительными, что особенно полезно при работе с мелкими деталями и электроникой.\n\n### Следы Великой войны\nБольшой шрам пересекает область правого глаза, заходя на бровь, веко и скулу. Левый глаз сохранил голубую радужку. Правый после ранения в \"Великой войне\" с внегалактическими существами приобрёл розовый оттенок. Оба глаза видят чётко. Изменение цвета связано с аномальным воздействием противника и последующим восстановлением тканей. Грудь, спина, руки и ноги покрыты старыми шрамами от осколков, ожогов и разрывов кожи. Внешне он цел, но эта целостность досталась ему дорого.\n\n### Белая пигментация\nВолосы на голове и по всему телу, включая брови, ресницы и щетину, утратили пигмент после применения древнего артефакта. Это приобретённое последствие контакта, а не возрастная седина. Кожа сохранила исходный тёплый оттенок. Отросшие волосы остаются белыми, обычное восстановление организма не возвращает им прежний цвет.\n\n### Костный комплекс\nУ Нейтана усилена регуляция формирования костной ткани. Плотный кортикальный слой сочетается с развитой внутренней трабекулярной структурой. В пределах мира эта мутация позволяет выдерживать удары и силовые нагрузки, при которых обычный человек получил бы перелом. Опорно-двигательный аппарат остаётся подвижным. Рост кости ограничен, суставные щели и нервные каналы сохранены.\n\n### Мышечный комплекс\nОслаблен миостатиновый тормоз роста скелетной мускулатуры. Мышечные волокна легче увеличивают поперечное сечение в ответ на нагрузку, а регулярные тренировки позволяют удерживать большую силу при компактном телосложении. У Дрейка это дополнено аномально эффективным вовлечением двигательных единиц. Он способен коротким усилием сдвинуть тяжёлый механизм, удержать сорвавшегося человека или вырваться из захвата, рассчитанного на обычного бойца. \n\n### Нейромоторный комплекс\nАномальные изменения нервной системы сократили задержку между восприятием сигнала и мышечным ответом. Ускоренное проведение нервных импульсов сочетается с быстрой обработкой зрительной, слуховой и вестибулярной информации. Нейтан раньше обычного человека замечает начало движения и успевает отреагировать на внезапную перемену обстановки. Точно отслеживает движущиеся объекты, быстро переключает внимание и мгновенно вносит поправки в положение тела. Развитое чувство положения конечностей позволяет сохранять согласованность движений во время падения, прыжка или резкого разворота. В кабине эти особенности проявляются в быстрой и точной работе с органами управления.\n\nБыстрые мышечные волокна обладают повышенной скоростью сокращения и расслабления, а согласованная работа двигательных единиц обеспечивает мощное отталкивание без лишнего напряжения. Нейтан стремительно срывается с места, за несколько шагов набирает высокую скорость и поддерживает частый, упругий бег. Сильные мышцы ног и корпуса вместе с эластичными сухожилиями позволяют эффективно возвращать энергию каждого шага, резко тормозить и быстро ускоряться в новом направлении. Координация сохраняется и на высокой скорости, поэтому он уверенно огибает препятствия и переходит от бега к прыжку или подъёму. В сочетании с метаболическим комплексом это даёт ему возможность повторять взрывные ускорения и долго сохранять высокий темп движения.\n\n### Метаболический комплекс\nОрганизм необычно устойчив к длительной нагрузке и умеренному недостатку кислорода. Адаптивная регуляция ответа на гипоксию сочетается с густой капиллярной сетью, высокой окислительной мощностью мышц и экономным расходованием топлива при ровном темпе. Нейтан дольше сохраняет ясность мышления в душной кабине и продолжает действовать после изнуряющего марша. \n\n### Соединительнотканный комплекс\nСухожилия, связки и места их прикрепления согласованы с повышенной мышечной тягой. Направленная укладка коллагеновых волокон позволяет распределять нагрузку, сохраняя рабочую эластичность. Без неё огромная сила слишком быстро разрушала бы собственные суставы. Дрейк способен на резкие смены направления и силовые акробатические движения.\n\n### Кровь\nГруппа крови - AB(IV) Rh+.","kind":"accordion"},{"no":"3.1","label":"Характер","value":"### Психологический профиль\nТип по MBTI - ESTP. Соционический ориентир - СЛЭ (Жуков).\n\nНейтан производит впечатление человека, который даже на собственный разбор полётов пришёл бы с чашкой чая и вопросом, почему все такие мрачные. Весёлый, ехидный, раскрепощённый, он охотно шутит над обстоятельствами и над собой. Легко вступает в разговор, любит живые впечатления и быстро увлекается интересной затеей. Может намеренно выглядеть чуть легкомысленнее, чем есть. Почти всегда держится с самодовольной улыбкой, и мало кто видел его по-настоящему подавленным.\n\n### Беззаботность и идеализм\nНейтан любит жить так, будто впереди ещё достаточно времени для всего интересного. Легко подхватывает чужую затею, может запеть посреди работы, устроить небольшой праздник после тяжёлого дня или увлечённо спорить о пустяке, пока вокруг царит всеобщая тревога. Ему нравится сам процесс жизни. Вкусная еда, музыка, скорость, удачный манёвр и хорошая компания радуют его искренне. Даже когда мир горит, он будет веселиться, пока ещё бьётся сердце.\n\nВ этой беззаботности есть привычка убегать от тяжёлой реальности. Дрейк умеет чинить повреждённую машину, находить выход из окружения и принимать сложные решения. Гораздо труднее ему надолго остаться наедине с потерями, усталостью и мыслями о том, что уже невозможно исправить. Тогда он ищет новую дорогу, берётся за интересную работу или собирает вокруг себя людей. Разговор о собственных переживаниях часто переводит в шутку, а неприятные размышления откладывает до тех пор, пока снова не появится дело.\n\nПри этом остаётся упрямым идеалистом. Верит, что люди способны становиться лучше, чужая доброта заслуживает ответа, а у жизни должно быть больше смысла, чем бесконечное выживание. Легко загорается мечтой и умеет говорить о будущем так, что оно кажется достижимым даже среди развалин. Ему хочется, чтобы у его товарищей оставались свои желания, смешные привычки и поводы радоваться. Он охотно втягивает их в разговоры, музыку и маленькие праздники, возвращая ощущение, что жизнь продолжается.\n\n### Самодовольная уверенность\nНейтан привык доверять собственному уму, реакции и умению выкручиваться. Держится так, будто уже знает, где искать выход, даже когда решение только складывается у него в голове. Любит произвести впечатление, красиво закончить манёвр и заметить чужое восхищение. Не стесняется похвастаться удачей или напомнить, кто только что спас положение. Неудачу встречает раздражённой усмешкой и быстро переключается на следующую попытку. Чужая уверенность в невозможности задачи часто лишь раззадоривает его.\n\n### Любопытство и отношение к людям\n\nЛюбопытство - его двигатель и самая надёжная приманка. Закрытая дверь интересует его сильнее открытого хранилища. Непонятная надпись способна задержать дольше нужного. Он любит красивое решение, заслуженное восхищение и хороший гонорар. Может заявить, что всё сделал исключительно за деньги, уже после того как потратил половину награды на чужое спасение. При этом не святой. Торгуется, хвастается удачным манёвром, любит эффектно появиться и убеждён, что в мире нет ничего необъяснимого.\n\nВ основе его поведения лежит простая доброта. Он умеет накормить, выслушать, починить чужую вещь и не превращать помощь в пожизненный долг. Не любит унижение слабых, бессмысленную жестокость и начальников, считающих людей расходным материалом. Может быть жёстким в бою и без колебаний пресечь угрозу, но не наслаждается чужим бессилием. Насмешкой чаще снимает напряжение, чем причиняет боль. Если задел близкого человека, постарается исправить это делом, а затем всё-таки извинится словами.\n\nОсобенно любит открытых и добрых людей, с которыми легко говорить прямо, смеяться и делиться тем, что действительно интересно. Замкнутые и холодные собеседники будят в нём другой интерес. Нейтану нравится \"раскалывать\" их сдержанность, подмечать неожиданные увлечения, вытягивать на живой разговор и ловить искренние реакции. Может поддеть шуткой, задать непривычный вопрос или затеять спор, чтобы увидеть человека за привычной невозмутимостью. Момент, когда суровый молчун вдруг начинает увлечённо рассказывать или смеяться, доставляет ему особенное удовольствие.\n\n### Поведение в опасности\nВ опасности его мышление становится особенно собранным, а внешняя манера сохраняет привычную дерзость. Нейтан способен шутить по связи, улыбаться противнику и получать удовольствие от сложного манёвра, одновременно следя за обстановкой. Азарт помогает ему удерживать инициативу. Решителен, храбр и настойчив, продолжает искать решение, когда очевидные варианты уже закончились.\n\nКак командир объясняет замысел, делегирует специалистам и берёт ответственность за собственный приказ. Особенно плохо переносит ситуацию, где кого-то нужно оставить. Может потратить последний резерв на ещё одну попытку эвакуации. Его беззаботная манера соседствует с сильной привязанностью к своим людям. Желание свободно идти за любой тайной постоянно сталкивается с пониманием, что за ним теперь идут другие.\n\n### Мудрость и мечты\n\nМудрость Дрейка выросла из ошибок, долгих дорог и разговоров с очень разными существами. Он любит философствовать за чаем. О свободе, цене победы, праве уйти и обязанности вернуться. Иногда вставляет древнее выражение, оставляет паузу и с заметным удовольствием ждёт просьбы перевести. Не считает прожитые годы доказательством собственной правоты. Любит молодых совершеннолетних женщин, взаимный флирт и острый ум.\n\nМечтает не о следующей войне, а о собственном тихом месте. Мастерская, надёжный ангар, длинный стол и чай, которого хватит каждому гостю. Пока же постоянно находит причину отложить эту жизнь. Ему проще снова починить чужую машину, чем признать, что сам он тоже устал.\n\n### Привычки\n\nЧай сопровождает почти весь его день - горячий, остывший, крепкий или лёгкий - под настроение и задачу. Он разбирается в листьях, воде и заваривании. Любимый ритуал - спокойно прогреть чашку перед тяжёлой работой. Не курит. Алкоголь допускает понемногу, когда смена и полёт закончены. Любит солёную и острую пищу. Белый шум, гул вентиляторов и ровное шуршание фена помогают уснуть.","kind":"text"},{"no":"3.2","label":"Яркие черты и умственные навыки","value":"### Боевой и инженерный склад ума\nНейтан быстро обрабатывает информацию в напряжённой обстановке. Видит связь между действиями противника, возможностями техники и особенностями местности. Обладает развитым пространственным мышлением, умеет оценивать траектории и просчитывать результат манёвра на ходу. Выделяет главное среди множества сигналов и быстро меняет решение при появлении новых обстоятельств.\n\nПри ремонте способен мысленно разобрать механизм на части, представить работу его узлов и найти причину неисправности. Хорошо понимает, как изменение одной детали повлияет на всю систему, и подбирает рабочее решение даже при недостатке запчастей. Его мышление сочетает практичность инженера, реакцию пилота и привычку искать нестандартный выход.\n\n### Быстрая обучаемость\nБыстро учится через наблюдение и практику. Схватывает принцип работы незнакомого устройства, запоминает показанную последовательность действий и переносит освоенные приёмы на похожие задачи. Охотно задаёт точные вопросы и проверяет догадки на деле. Допущенную ошибку разбирает по причинам, поэтому следующая попытка обычно заметно точнее предыдущей. Особенно легко ему даются пилотирование, механика, электроника и двигательные навыки.\n\n### Чувство машины\nМысленно собирает мех в единую кинематическую схему. Чувствует массу, инерцию, предел сцепления, задержку приводов и доступный запас мощности. По звуку и вибрации отличает неисправность от обычного износа. Быстро осваивает незнакомую платформу, но сначала проверяет органы управления и ограничения. \n\n### Малые космические суда\nУмеет пилотировать небольшие космические суда, включая шаттлы, лёгкие транспортники и экспедиционные корабли. Разбирается в их управлении и навигации, выполняет стыковку, орбитальные манёвры и посадку на поверхность. Знаком с базовым обслуживанием бортовых систем. Может найти неисправный контакт, восстановить повреждённую проводку, заменить доступный модуль и привести в порядок механические узлы. Этих навыков хватает для текущего ремонта и возвращения в строй потрёпанной машины, если основные системы ещё работоспособны.\n\n### Гравитационные платформы и антигравитационная техника\nУверенно пилотирует гравитационные платформы, ховеры и другую антигравитационную технику. Хорошо чувствует скорость, инерцию и отклик машины на управление. Точно выдерживает высоту, рассчитывает тормозной путь и проводит аппарат через тесные проходы, используя доступное пространство до последнего метра. При смене нагрузки быстро подстраивает манеру пилотирования под изменившееся поведение машины. Особенно любит скоростные манёвры над сложным рельефом, где нужно одновременно читать местность, удерживать траекторию и заранее видеть следующий поворот.\n\n### Управление наземной техникой\nВодит багги, бронетранспортёры, вездеходы и тяжёлые грузовые машины. Умеет управлять ходовой частью и рабочими механизмами буровых платформ. Чувствует габариты, распределение массы и сцепление с поверхностью, подбирает темп движения под грунт, уклон и состояние техники. На лёгкой машине охотно использует её манёвренность, а за рулём тяжёлой заранее рассчитывает поворот и остановку. По поведению двигателя, подвески и трансмиссии замечает неполадки ещё до того, как они заставят экипаж продолжить путь пешком.\n\n### Полевая робототехника\nУмеет собирать полезные устройства из доступных деталей и узлов списанной техники. Может соорудить разведывательный дрон, ремонтного паука, простую турель или дистанционный манипулятор. Подбирает совместимые компоненты, налаживает питание и управление, настраивает датчики и приводы под конкретную задачу. Хорошо приспосабливает готовые механизмы к новой работе. В его мастерской сломанный робот быстро превращается в запас деталей для нескольких других. Особую радость ему доставляет момент, когда собранная из разномастного железа конструкция впервые самостоятельно выполняет команду.\n\n### Паркур и акробатика\nС детства увлекался скалолазанием, а годы экспедиций и боёв превратили эту привычку в уверенное владение собственным телом. Быстро перемещается по разрушенным конструкциям, корпусам кораблей, недостроенным платформам, скалам и городским руинам. На ходу замечает опоры, связывает прыжки, подтягивания и перелезания в непрерывное движение. Умеет сохранять равновесие на узких поверхностях, точно приземляться и быстро менять направление. Сильная, ловкая хватка позволяет удерживаться на крошечных уступах и перехватываться за неудобные выступы. В незнакомом месте почти сразу замечает путь наверх.\n\n### Тактическая импровизация\nУмеет менять план внутри уже начатого манёвра. Видит полезные особенности местности и техники, заставляет противника играть по своим правилам. В больших операциях удерживает общую задачу, распределяет роли и не мешает специалисту, который знает свой участок лучше. Особенно силён там, где стандартный протокол перестал работать.\n\n### Грязный бой - \"Хшардрал\"\nОснова - опыт бокса, карате, борьбы и других школ. Собственный стиль построен на обмане ожиданий, смене темпа, нарушении равновесия и использовании окружения. Дрейк не вступает в обмен ударами ради красивого поединка. Его подвижность, сильный захват и короткие взрывные усилия позволяют навязать неудобную дистанцию. В основном данный стиль боя подходит именно за рулём меха, но и в простом ближнем бою показывает интересные результаты.\n\n### Оружейная грамотность\nЗа долгие кампании освоил множество стрелковых систем и хорошо работает со штурмовым оружием. Понимает отдачу, режимы огня, обслуживание и ограничения боеприпаса. Уверенно действует в ЛБС и СБС. \n\n### Языки и артефакты\nВладеет несколькими современными языками и читает ряд древних письменностей. Различает назначение надписи, учитывает контекст и охотно сверяет перевод с записями. Знает типичные принципы древних механизмов, способы их консервации и признаки опасной активации. Всё неизвестное считает поводом для исследования, хотя азарт порой заставляет его слишком рано перейти от наблюдения к проверке.\n\n### Певческий голос\nОбладает низким, насыщенным голосом с тёплым грудным тембром и хорошим музыкальным слухом. Красиво поёт, уверенно берёт низкие ноты, точно держит мелодию и умеет вести протяжённые фразы на ровном дыхании. Особенно выразительно звучит в спокойных песнях и балладах, где можно раскрыть глубину голоса. Легко подхватывает знакомую мелодию и охотно поёт в компании. Во время работы иногда негромко напевает себе под нос.\n\n### Хороший повар \"Из того, что есть\"\nУмеет приготовить вкусную, сытную еду из скудных экспедиционных запасов и случайных находок на местном рынке. Хорошо обращается с мясом, чувствует сочетания вкусов и умеет придать характер даже надоевшему походному пайку. Ловко заменяет недостающие ингредиенты, готовит на маленькой корабельной кухне или у походного огня и редко нуждается в точном рецепте. Сам предпочитает солёное и острое, но запоминает вкусы товарищей и подстраивает приправы под компанию. Кормить людей ему нравится почти так же, как угощать их чаем.\n\nПро его стряпню в команде шутят. \"Дайте ему мясо и гранит, и будет вам солёное мяско\".\n\n### Вкус к жизни\nМеломан без привязанности к одному жанру. Слушает то, что приятно слуху, сердцу и разуму. В мастерской может сменить тяжёлую музыку на старинную балладу, а затем потребовать тишины, чтобы услышать подшипник. Чай - лучший напиток во вселенной. Запоминает, кто что любит, спорит о заварке серьёзнее, чем о званиях. Обожает белый шум в виде вентиляторов или звука фена.","kind":"accordion"},{"no":"3.3","label":"Осколки воспоминаний","value":"### Белое утро\nВо время одной из экспедиций Нейтан вместе с командой нашёл древний артефакт. При активации его воздействие охватило всех, кто стоял рядом. Волосы обесцветились целиком, включая брови, ресницы и щетину. Участники ещё некоторое время разглядывали друг друга, пытаясь привыкнуть к одинаково белым головам.\n\nВскоре обнаружились и другие перемены. Организм легче переносил нагрузки, быстрее восстанавливался, прибавились сила и выносливость. У Нейтана изменения особенно заметно проявились в работе мышц и общей физической устойчивости. Воздействие артефакта оказалось благотворным, а белый цвет волос так и остался у всех, кто попал под него.\n\n### Древний драндулет\nПредмет, ради которого Нейтан добрался до далёкой планеты, оказался искусной подделкой. Поиски отняли немало времени, а обратный путь пришлось искать среди остатков старой стоянки. Там он и обнаружил небольшой древний корабль, покрытый пылью и следами долгого запустения.\n\nНейтан вскрыл сервисные панели, проверил питание и постепенно вернул к жизни погасший пульт. Зачистил окислившиеся соединения, заменил неисправный блок одним из уцелевших запасных и освободил заклинивший механизм. После нескольких попыток судно отозвалось тяжёлым гулом. Дрейк ещё долго проверял показания и разбирался с расположением органов управления, прежде чем решился на взлёт.\n\nСтарый драндулет поднялся над стоянкой, дрожа всем корпусом, и всё же вышел на орбиту. Нейтан увёл его от планеты и проложил обратный курс. Бесполезная подделка лежала рядом с креслом, пока он следил за приборами и прислушивался к неровному гулу двигателя.\n\n### Война за ГАЛАКТИКУ!\nВеликая война принесла существ из-за пределов галактики. Их прозвали \"Хшарами\". Одно такое создание могло выдержать натиск целой флотилии... Нейтан за кампанию уничтожил несколько, действуя в одиночку на мехе. Это не было превосходством лобовой огневой мощи. Он находил уязвимые фазы, использовал близкую дистанцию, особенности среды и возможность действовать внутри зон, куда корабли не могли безопасно вести огонь. Машины после этих боёв восстанавливались не всегда. Хотя больше в степени ему помогали множество артефактов и очень много удачи, существа которые могут дезинтегрировать пространство и только чего ещё не умеют... очень тяжёлые противники.\n\n### Ловушка для Хшара\n\nОн помнит, как под ногами Титана рассыпался камень, а позади исчезали целые участки склона. Хшар шёл следом, стирая пространство вместе с тем, что в нём находилось. Нейтан вёл его к ловушке, оставляя противнику ровно столько надежды настичь ускользающую машину, чтобы тот не прекратил погоню. На последнем участке уже не оглядывался. Только считал расстояние и улыбался, крепко стиснув зубы.\n\nАнтиматериальная бомба сработала, когда существо оказалось внутри подготовленной зоны. Горизонт превратился в ослепительную белую полосу, а показания внешних датчиков исчезли одно за другим. Взрыв уничтожил часть планеты вместе с загнанным в ловушку Хшаром. Нейтана вынесло за пределы разрушения на искалеченной машине. Позже он долго смотрел на карту, где вместо знакомого участка поверхности зияла пустота.\n\n### Кабина и ноги\n\nОт меха остались кабина и ноги. Оружие, манипуляторы и большая часть корпуса были потеряны во время встречи с группой Хшаров. Последние минуты боя трудно было назвать боем. Дрейк убегал, выжимая из уцелевших приводов всё, что они ещё могли отдать. Машина неслась прочь с такой прытью, будто тоже прекрасно понимала, чем закончится остановка.\n\nТеперь он сидел возле раскрытого сервисного люка, держа чашку между коленями. На полу лежали обгоревшие детали, рядом сохли вымытые разъёмы. Нейтан перебирал повреждённую электронику, соединял уцелевшие системы и время от времени отступал, чтобы оценить получившееся безобразие. \"Ноги есть. Голова на месте. Уже богаче некоторых\". Первый ровный шаг восстановленного меха он встретил той же самодовольной улыбкой, с которой потом рассказывал, что всего лишь решил сменить позицию.\n\n### Последний бой\n\nОсновные силы Хшаров сомкнули кольцо. Путь отхода ещё оставался, но времени провести через него всех уже не было. Нейтан приказал союзникам отступать. Без долгой речи, без просьб запомнить его. Убедился, что приказ принят, развернул мех навстречу противнику и направил оставшуюся мощность в движение. На лице всё ещё держалась привычная самодовольная улыбка.\n\nОн вступил в схватку на предельной дистанции, прорываясь сквозь огонь и разрушающееся пространство к одному из высших Хшаров. Машина теряла системы, но продолжала отвечать. Нейтану удалось навязать ближний бой и нанести существу смертельное ранение. На мгновение продвижение противника захлебнулось. Этого хватило, чтобы отступающие союзники выиграли необходимое время.\n\nОтветный удар уничтожил мех вместе с пилотом. Нейтан Дрейк погиб в этом бою. Последний пакет с его нейрослепком успел покинуть машину до разрушения кабины. Принимающая система подтвердила целостность данных. Нейрослепок был успешно сохранён.","kind":"memories"},{"no":"4.1","label":"Главный подкласс","value":"Коммандер","kind":"text"},{"no":"4.2","label":"Основной подкласс","value":"Мех-драйвер","kind":"text"},{"no":"4.3","label":"Боевой подкласс","value":"Штурмовик","kind":"text"},{"no":"4.4","label":"Дополнительные подклассы","value":"Пилот, робототехника и мелкая электроника","kind":"text"},{"no":"4.5","label":"Арт персонажа","value":"Арт приложен.","kind":"text"}],"intro":"Любопытство - так и потянет его, вызвать восхищение и получить вознаграждение."}</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const data = JSON.parse($('profile-data').textContent);
  const fields = new Map(data.fields.map(field => [field.no, field]));
  const get = no => fields.get(no);
  const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = 'home', memoryIndex = -1, statusTimer;
  let audio = null, master = null, sound = true, awakened = false, lastHover = 0;
  $('intro').textContent = data.intro;

  function splitChapters(value) {
    const result = [], chunks = value.split(/^###\s+/m);
    if (chunks[0].trim()) result.push({title:'', text:chunks[0].trim()});
    chunks.slice(1).forEach(chunk => { const end = chunk.indexOf('\n'); result.push({title:(end === -1 ? chunk : chunk.slice(0,end)).trim(), text:end === -1 ? '' : chunk.slice(end+1).trim()}); });
    return result;
  }
  const memories = splitChapters(get('3.3').value);
  function paragraphs(value) { return value.split(/\n\s*\n/).filter(Boolean).map(p => '<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>').join(''); }
  function textContent(value) { return '<div class="text-block">'+splitChapters(value).map(c => (c.title ? '<h3>'+esc(c.title)+'</h3>' : '')+paragraphs(c.text)).join('')+'</div>'; }
  function facts(numbers) {
    return '<dl class="facts">'+numbers.map(no => { const field = get(no);return '<div class="fact '+(no==='1.3'?'id':'')+'"><dt>'+field.no+' '+esc(field.label)+'</dt><dd>'+esc(field.value)+'</dd></div>'; }).join('')+'</dl>';
  }
  function fileButton(title, target, number) { return '<button class="file-button" data-open="'+target+'"><span class="file-icon" aria-hidden="true"></span><span>'+esc(title)+'</span><span class="file-number">'+String(number).padStart(2,'0')+'</span></button>'; }

  // Синтез коротких импульсов старого терминала без внешних аудиофайлов.
  function setupAudio() {
    if (audio) return;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audio = new Audio();master = audio.createGain();master.gain.value = sound ? .6 : 0;master.connect(audio.destination);
    } catch { audio = null; }
  }
  function tone(frequency = 650, duration = .07, offset = 0) {
    if (!sound || !audio || audio.state !== 'running') return;
    const start = audio.currentTime + offset, oscillator = audio.createOscillator(), gain = audio.createGain();
    oscillator.type = 'square';oscillator.frequency.setValueAtTime(frequency,start);oscillator.frequency.exponentialRampToValueAtTime(frequency*.83,start+duration);
    gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.012,start+.004);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
    oscillator.connect(gain);gain.connect(master);oscillator.start(start);oscillator.stop(start+duration+.02);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
  }
  function crackle(duration = .22, volume = .1) {
    if (!sound || !audio || audio.state !== 'running') return;
    const count = Math.ceil(audio.sampleRate*duration), buffer = audio.createBuffer(1,count,audio.sampleRate), channel = buffer.getChannelData(0);
    let impulse = 0;
    for (let i=0;i<count;i++) { if(Math.random()<.003)impulse=(Math.random()*2-1)*.85;impulse*=.83;channel[i]=((Math.random()*2-1)*.035+impulse)*(1-i/count); }
    const source=audio.createBufferSource(), filter=audio.createBiquadFilter(), gain=audio.createGain();
    source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1900;filter.Q.value=.48;gain.gain.value=volume;
    source.connect(filter);filter.connect(gain);gain.connect(master);source.start();source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};
  }
  async function activateSound() {
    if(!sound)return;setupAudio();if(!audio)return;
    try { if(audio.state==='suspended')await audio.resume();if(audio.state==='running'&&!awakened){awakened=true;crackle(.7,.2);} } catch {}
  }
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('#soundButton'))activateSound();},{passive:true});
  document.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' ')activateSound();});
  $('soundButton').addEventListener('click',async()=>{
    sound=!sound;$('soundButton').setAttribute('aria-pressed',String(sound));$('soundButton').setAttribute('aria-label',sound?'Выключить звук':'Включить звук');
    if(master)master.gain.setTargetAtTime(sound?.6:0,audio.currentTime,.025);
    if(sound){await activateSound();tone(490,.065);}
  });
  document.addEventListener('pointerover',event=>{
    if(!event.target.closest('.folder,.file-button'))return;const now=Date.now();if(now-lastHover<150)return;lastHover=now;tone(850,.025);
  });
  function clickSound(){crackle(.075,.1);tone(580,.065);tone(290,.045,.055);}

  function show(route, focus = true) {
    current=route;$('folderView').hidden=route!=='home';$('reader').hidden=route==='home';
    let title='', html='', back='← Папки';
    if(route==='personal'){title='Личные данные';html=facts(['1.1','1.2','1.3']);}
    if(route==='physical'){title='Физические данные';html=facts(['2.1','2.2','2.3'])+textContent(get('2.4').value);}
    if(route==='mental'){title='Ментальные данные';html='<div class="file-list">'+fileButton('Характер','character',1)+fileButton('Черты и навыки','skills',2)+fileButton('Осколки памяти','memories',3)+'</div>';}
    if(route==='classes'){title='Подклассы';html=facts(['4.1','4.2','4.3','4.4']);}
    if(route==='character'){title='Характер';html=textContent(get('3.1').value);back='← Назад';}
    if(route==='skills'){title='Черты и навыки';html=textContent(get('3.2').value);back='← Назад';}
    if(route==='memories'){title='Осколки памяти';html='<div class="file-list">'+memories.map((m,i)=>fileButton(m.title,'memory-'+i,i+1)).join('')+'</div>';back='← Назад';}
    if(route.startsWith('memory-')){memoryIndex=Number(route.slice(7));const memory=memories[memoryIndex];if(!memory){show('memories');return;}title=memory.title;html='<div class="text-block">'+paragraphs(memory.text)+'</div>';back='← Назад';}
    $('readerTitle').textContent=title;$('readerContent').innerHTML=html;$('backButton').textContent=back;$('readerContent').scrollTop=0;
    if(focus){
      const control=route==='home' ? $('folderView').querySelector('button') : $('readerContent').querySelector('button') || $('readerContent');
      control?.focus({preventScroll:true});
      if(window.innerWidth<=560 && $('rightPanel').getBoundingClientRect().top<0)$('rightPanel').scrollIntoView({behavior:'instant',block:'start'});
    }
  }
  document.addEventListener('click',event=>{
    const folder=event.target.closest('[data-folder]'), file=event.target.closest('[data-open]');
    if(folder){clickSound();show(folder.dataset.folder);}if(file){clickSound();show(file.dataset.open);}
  });
  $('backButton').addEventListener('click',()=>{clickSound();show(current.startsWith('memory-')?'memories':['character','skills','memories'].includes(current)?'mental':'home');});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('desktop').hidden&&!$('copyFallback').open&&current!=='home'){$('backButton').click();}});

  function templateText() {
    const headings={'1':'Личные данные','2':'Физические данные','3':'Ментальные данные','4':'Не входящее в категории'};
    let last='', text='';
    data.fields.forEach(field=>{
      const section=field.no[0];if(section!==last){last=section;text+='\n('+section+'.) '+headings[section]+'\n\n';}
      const plain=field.value.replace(/^###\s*/gm,'');
      if(plain.includes('\n'))text+=field.no+' '+field.label+'\n'+plain+'\n\n';
      else text+=field.no+' '+field.label+' ('+plain+')\n\n';
    });
    return text.trim();
  }
  function status(message){clearTimeout(statusTimer);$('copyStatus').textContent=message;statusTimer=setTimeout(()=>$('copyStatus').textContent='',4000);}
  $('copyButton').addEventListener('click',async()=>{
    clickSound();const text=templateText();let copied=false;
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);copied=true;}}catch{}
    if(!copied){
      const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-10000px;top:0';area.setAttribute('aria-hidden','true');document.body.append(area);area.select();
      try{copied=document.execCommand('copy');}catch{}area.remove();
    }
    if(copied){status('АНКЕТА СКОПИРОВАНА');return;}
    $('copyText').value=text;$('copyFallback').showModal();$('copyText').focus();$('copyText').select();
  });
  $('closeFallback').addEventListener('click',()=>$('copyFallback').close());

  const lines=['ПОДАЧА ПИТАНИЯ','ПРОВЕРКА ПАМЯТИ','ЧТЕНИЕ АРХИВА','НЕЙТАН ДРЕЙК','ДОСЬЕ НАЙДЕНО'];
  async function boot(){
    setupAudio();if(audio?.state==='running'){awakened=true;crackle(1.25,.18);}
    for(let i=0;i<lines.length;i++){
      await new Promise(resolve=>setTimeout(resolve,reduced?70:360+i*70));
      const line=document.createElement('p');line.textContent=lines[i];$('bootLog').append(line);tone(220+i*87,.035);crackle(.05,.04);
    }
    $('openDossier').hidden=false;tone(470,.13);
  }
  $('openDossier').addEventListener('click',async()=>{
    // Открытие досье не зависит от разрешения браузера на воспроизведение звука.
    $('boot').hidden=true;$('desktop').hidden=false;$('desktop').classList.add('power-reveal');show('home');
    activateSound().then(()=>{crackle(.35,.17);tone(170,.16);tone(520,.09,.13);});
  });
  document.addEventListener('visibilitychange',()=>{if(!audio)return;if(document.hidden)audio.suspend().catch(()=>{});else if(sound&&awakened)audio.resume().catch(()=>{});});
  boot();
})();

</script>
